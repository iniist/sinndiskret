# Lädt den Ordner public/ per SFTP zu STRATO hoch.
#   Push auf dev  -> /sinndiskret-test/  (test.sinndiskret.de)
#   Push auf main -> /sinndiskret/       (sinndiskret.de)
# Zusätzlich manuell startbar unter "Actions" -> "Deploy zu STRATO" -> "Run workflow".

name: Deploy zu STRATO

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Nie zwei Uploads gleichzeitig in denselben Ordner.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Ziel festlegen
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/sinndiskret/" >> "$GITHUB_OUTPUT"
            echo "url=https://sinndiskret.de" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/sinndiskret-test/" >> "$GITHUB_OUTPUT"
            echo "url=https://test.sinndiskret.de" >> "$GITHUB_OUTPUT"
          fi

      - name: Testseite für Suchmaschinen sperren
        if: github.ref_name == 'dev'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
          cat >> public/.htaccess <<'HTACCESS'

          # Nur Testseite: nicht in Suchmaschinen aufnehmen
          <IfModule mod_headers.c>
            Header set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          HTACCESS

      - name: Versionsdatei schreiben
        run: |
          {
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Zeit:   $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M:%S')"
          } > public/version.txt

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Spiegelt public/ in den Zielordner. Dateien, die im Repo gelöscht
      # wurden, werden auch auf dem Server gelöscht – aber nur in diesem Ordner.
      - name: Upload per SFTP
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          TARGET_DIR: ${{ steps.target.outputs.dir }}
        run: |
          lftp --env-password -u "$SFTP_USERNAME" "sftp://$SFTP_SERVER" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --delete --verbose --parallel=4 ./public/ $TARGET_DIR
          bye
          LFTP

      - name: Fertig
        run: echo "Deploy abgeschlossen. Prüfen unter ${{ steps.target.outputs.url }}/version.txt" >> "$GITHUB_STEP_SUMMARY"
